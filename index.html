<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="main">
        <nav>
            <div id="navbar">
                <h2>Productivity Dashboard</h2>
            </div>
            <div id="changetheme">
                <button id="theme-toggle" >Toggle Theme</button>
            </div>
        </nav>

        <section class="allelements">

           <div class="todo elem" id="1">
            Todo List
           </div>
           <div class="dailyplanner elem" id="2">
            Daily Planner
           </div>
           <div class="motivation elem" id="3">
            motivation
           </div>
           <div class="pomodoro elem" id="4">
            pomodoro timer
           </div>
           <div class="dailytask elem" id="5">
            daily task
           </div>

            
        </section>
    </div>
    
    
    <script src="script.js"></script>
</body>
</html>
